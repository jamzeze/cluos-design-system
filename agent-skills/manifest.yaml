# CluOS Agent Skills Manifest
# Canonical source: this repo (cluos-design-system), agent-skills/
# Installed (copied, not symlinked) into ~/.claude/skills/,
# ~/.codex/skills/, and ~/.agents/skills/ by scripts/sync-agent-skills.sh. Re-run that script
# after any edit here — it is idempotent and reports drift.

version: 2
canonical_root: agent-skills/frontend
last_synced: null   # canonical source is not mutated; use sync-agent-skills.sh --check for state

skills:
  - slug: anti-ai-slop-frontend
    version: 2
    description: "Mandatory frontend router — classifies task depth (N-skip, N0–N3) and names the skills that run next."
    triggers: [frontend, ui, interface, tela, página, componente, layout, css, tailwind, tema, design system, responsivo, tipografia, paleta, dashboard, formulário, tabela, card, modal, redesign]
    depends_on: []
    precedes: [ux-layout-architect, design-gallery, frontend-craftsman, design-system-refactor-director]
    references: [../shared/routing-matrix.yaml, ../shared/anti-slop-rubric.md]
    compatible_with: [claude, codex, agents]
    cluos_profile: profiles/cluos
    path: frontend/anti-ai-slop-frontend/SKILL.md

  - slug: ux-layout-architect
    version: 1
    description: "Creates a task-first screen placement contract before visual exploration or implementation."
    triggers: [layout, hierarquia, posicionamento, tela, fluxo, dashboard, formulário, tabela, split pane, inspector, workbench, anamnese, laudo, receita, pedido de exame, mapeamento]
    depends_on: [anti-ai-slop-frontend]
    precedes: [design-gallery, frontend-craftsman, design-critic]
    references: [../shared/routing-matrix.yaml, ../shared/anti-slop-rubric.md]
    compatible_with: [claude, codex, agents]
    cluos_profile: profiles/cluos
    path: frontend/ux-layout-architect/SKILL.md

  - slug: design-gallery
    version: 2
    description: "Records a comparison of visual alternatives or an explicit legacy opt-out for N2/N3 work; never changes the cluos-mms-v1 default."
    triggers: ["opt-out", "comparar direções", "qual direção"]
    depends_on: [anti-ai-slop-frontend]
    precedes: [frontend-craftsman]
    references: [../shared/design-archetypes.yaml, ../shared/palette-policy.md]
    compatible_with: [claude, codex, agents]
    cluos_profile: profiles/cluos
    path: frontend/design-gallery/SKILL.md

  - slug: frontend-craftsman
    version: 2
    description: "Implements the approved direction and structure as functional, accessible, tested frontend code."
    triggers: [implementar, criar componente, refatorar tabela, formulário]
    depends_on: [anti-ai-slop-frontend]
    precedes: [design-critic]
    references: [../shared/anti-slop-rubric.md]
    compatible_with: [claude, codex, agents]
    cluos_profile: profiles/cluos
    path: frontend/frontend-craftsman/SKILL.md

  - slug: design-critic
    version: 2
    description: "Independent visual/usability review of the rendered result against the anti-slop rubric, before design-qa."
    triggers: []
    depends_on: [frontend-craftsman]
    precedes: [design-qa]
    references: [../shared/anti-slop-rubric.md]
    compatible_with: [claude, codex, agents]
    cluos_profile: profiles/cluos
    path: frontend/design-critic/SKILL.md

  - slug: design-qa
    version: 1
    description: "Compares the rendered implementation with its approved target (layout contract, cluos-mms-v1 or recorded opt-out) after design-critic passes."
    triggers: []
    depends_on: [design-critic]
    precedes: [verification-before-completion]
    references: [../shared/anti-slop-rubric.md]
    compatible_with: [claude, codex, agents]
    cluos_profile: profiles/cluos
    path: frontend/design-qa/SKILL.md

  - slug: design-system-refactor-director
    version: 2
    description: "Conducts systemic (N3) design system refactors across the 16 required phases."
    triggers: ["refatorar design system", "mudar paleta global", "novo primitive"]
    depends_on: [anti-ai-slop-frontend]
    precedes: [design-gallery, writing-plans]
    references: [../shared/design-archetypes.yaml, ../shared/palette-policy.md, ../shared/anti-slop-rubric.md]
    compatible_with: [claude, codex, agents]
    cluos_profile: profiles/cluos
    path: frontend/design-system-refactor-director/SKILL.md
