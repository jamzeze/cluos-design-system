# Runtime routing contract. Cases and historical evidence live in ../evals/.
version: 3
selection: highest_impacted_scope
precedence: [N3, N2, N1, N0, N-skip]

# Determine impact from the authorized task plus inspected target/callers.
# Pure backend and review-only work exit before this implementation matrix.
levels:
  N3:
    name: "Fundação compartilhada"
    predicate: "Altera definição de token/paleta global, design system ou primitive compartilhado entre superfícies, mesmo em uma linha."
    flow: [anti-ai-slop-frontend, design-system-refactor-director, "ux-layout-architect (quando fluxos/telas mudarem)", writing-plans, frontend-craftsman, design-critic, design-qa, verification-before-completion]
    loads: [anti-slop-rubric.md, profile, "design-archetypes.yaml + palette-policy.md (somente com comparação ou opt-out registrado)"]
    artifacts: [routing.md, "ux-layout-contract.md (quando telas/fluxos mudarem)", "design-decision.md (somente com mudança/opt-out de direção)", design-critic.md, design-qa.md]
    gallery_required: false
    selection_required: false
    default_style: cluos-mms-v1
    note: "Mudança compartilhada não é N0 por ser pequena. Correção de token não exige escolher outra identidade ou criar contrato de layout sem mudança estrutural."

  N2:
    name: "Tela ou fluxo"
    predicate: "Cria ou redesenha tela/fluxo completo, dashboard, landing page ou organização entre zonas de uma tela."
    flow: [anti-ai-slop-frontend, ux-layout-architect, frontend-craftsman, design-critic, design-qa, verification-before-completion]
    loads: [anti-slop-rubric.md, profile, "design-archetypes.yaml + palette-policy.md (somente com comparação ou opt-out registrado)"]
    artifacts: [routing.md, ux-layout-contract.md, "design-decision.md (somente com opt-out)", design-critic.md, design-qa.md]
    gallery_required: false
    selection_required: false
    default_style: cluos-mms-v1

  N1:
    name: "Componente ou seção local"
    predicate: "Cria/refatora componente ou seção local, ou muda agrupamento, posição de ações, ordem de foco/leitura ou hierarquia dentro dela, sem impacto N2/N3."
    flow: [anti-ai-slop-frontend, "ux-layout-architect (se posicionamento/hierarquia ou ordem de leitura/foco estiverem em escopo)", frontend-craftsman, design-critic, design-qa, verification-before-completion]
    loads: [anti-slop-rubric.md, profile]
    artifacts: [routing.md, "ux-layout-contract.md (quando ux-layout-architect roda)", design-critic.md, design-qa.md]
    gallery_required: false
    selection_required: false

  N0:
    name: "Ajuste local de apresentação"
    predicate: "Ajusta texto, alinhamento, foco visível ou movimento, ou restaura interação já definida de elemento local existente; pode aplicar token existente, mas não altera sua definição, estrutura, semântica da ação ou ordem de leitura/foco."
    flow: [anti-ai-slop-frontend, frontend-craftsman, verificação-visual]
    loads: [anti-slop-rubric.md]
    artifacts: []
    gallery_required: false
    selection_required: false

  N-skip:
    name: "Lógica com representação existente"
    predicate: "Altera domínio, estado, cálculo, dado ou geometria que apenas produz outro valor/desenho em uma representação já definida; nenhum impacto N0/N1/N2/N3."
    flow: [anti-ai-slop-frontend, verificação-visual]
    loads: []
    artifacts: []
    gallery_required: false
    selection_required: false
    note: "Sai da cadeia visual; segue regras de engenharia e verifica o render. Não dispensa testes de autorização ou de lógica."

# profile = brand-context.md + product-context.md da raiz de profile resolvida;
# consultar decisões ou inventário adicionais só se necessários ao escopo.
# design-gallery só entra com comparação registrada ou opt-out explícito.
# N-skip/N0 não criam artefatos; N1+ reutiliza um diretório por tarefa:
# docs/frontend-routing/<YYYY-MM-DD>-<slug>/.
